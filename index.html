<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali Greeting Card</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1a1a1a, #000);
    font-family: "Poppins", sans-serif;
  }

  .card {
    width: 350px;
    height: 500px;
    background: linear-gradient(to bottom, #2c2c54, #1e1e2f);
    border-radius: 30px;
    box-shadow: 0 0 50px rgba(255, 200, 50, 0.6);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    flex-direction: column;
    color: gold;
  }

  /* Glow behind elements */
  .glow {
    position: absolute;
    border-radius: 50%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(255,180,0,0.6), rgba(255,180,0,0));
    animation: pulse 2s infinite alternate;
    z-index: 0;
  }
  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.7; }
    100% { transform: scale(1.2); opacity: 0.5; }
  }

  .stage {
    position: absolute;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1;
  }

  /* Diya */
  .diya {
    width: 120px;
    height: 60px;
    background: linear-gradient(to bottom, #ffb347, #ffcc33);
    border-radius: 0 0 80px 80px;
    box-shadow: 0 0 40px #ffcc33;
    position: relative;
  }
  .diya .flame {
    width: 20px;
    height: 40px;
    background: radial-gradient(circle, #fff39f, #ff6600);
    border-radius: 50%;
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-52%) scale(1.1); opacity: 0.8; }
    100% { transform: translateX(-48%) scale(0.95); opacity: 1; }
  }

  /* Candle */
  .candle {
    width: 40px;
    height: 100px;
    background: linear-gradient(to bottom, #fff, #ddd);
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(255,255,255,0.4);
    position: relative;
  }
  .candle .flame {
    width: 15px;
    height: 30px;
    background: radial-gradient(circle, #fff9c0, #ff9900);
    border-radius: 50%;
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    animation: flickerCandle 0.15s infinite;
  }
  @keyframes flickerCandle {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-51%) scale(1.05); opacity: 0.9; }
    100% { transform: translateX(-49%) scale(0.95); opacity: 1; }
  }

  /* LED lights */
  .led-container {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .led {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff;
    animation: blink 1s infinite alternate;
  }
  .led:nth-child(1){ background:red; animation-delay:0s; box-shadow:0 0 8px red;}
  .led:nth-child(2){ background:yellow; animation-delay:0.2s; box-shadow:0 0 8px yellow;}
  .led:nth-child(3){ background:green; animation-delay:0.4s; box-shadow:0 0 8px green;}
  .led:nth-child(4){ background:blue; animation-delay:0.6s; box-shadow:0 0 8px blue;}
  .led:nth-child(5){ background:pink; animation-delay:0.8s; box-shadow:0 0 8px pink;}
  @keyframes blink {
    0% { opacity:0.2; transform:scale(0.8);}
    50% { opacity:1; transform:scale(1.2);}
    100% { opacity:0.2; transform:scale(0.8);}
  }

  /* Text Styles */
  .text {
    position: absolute;
    z-index: 2;
    font-size: 2.2em;
    text-align: center;
    opacity: 0;
    color: gold;
    text-shadow: 0 0 20px #ffcc33, 0 0 40px #ff6600, 0 0 60px #ff3300;
    transition: opacity 1s ease-in-out;
  }

  .final-text {
    position: absolute;
    z-index: 2;
    font-size: 1.8em;
    text-align: center;
    opacity: 0;
    color: #ffe066;
    text-shadow: 0 0 15px #ffcc33;
    transition: opacity 1s ease-in-out;
  }

</style>
</head>
<body>

<div class="card">
  <div class="glow"></div>

  <!-- Initial Text -->
  <div class="text" id="startText">✨ Happy Diwali ✨</div>

  <!-- Diya -->
  <div class="stage" id="diyaStage">
    <div class="diya"><div class="flame"></div></div>
  </div>

  <!-- Candle -->
  <div class="stage" id="candleStage">
    <div class="candle"><div class="flame"></div></div>
  </div>

  <!-- LED -->
  <div class="stage" id="ledStage">
    <div class="led-container">
      <div class="led"></div>
      <div class="led"></div>
      <div class="led"></div>
      <div class="led"></div>
      <div class="led"></div>
    </div>
  </div>

  <!-- Final Text -->
  <div class="final-text" id="finalText">#2025 🎉</div>

</div>

<script>
  const startText = document.getElementById("startText");
  const diyaStage = document.getElementById("diyaStage");
  const candleStage = document.getElementById("candleStage");
  const ledStage = document.getElementById("ledStage");
  const finalText = document.getElementById("finalText");

  // Show initial text immediately
  startText.style.opacity = 1;

  setTimeout(() => {
    startText.style.opacity = 0;
    diyaStage.style.opacity = 1; // Diya appears
  }, 2000);

  setTimeout(() => {
    diyaStage.style.opacity = 0;
    candleStage.style.opacity = 1; // Candle appears
  }, 4500);

  setTimeout(() => {
    candleStage.style.opacity = 0;
    ledStage.style.opacity = 1; // LED lights
  }, 7000);

  setTimeout(() => {
    ledStage.style.opacity = 0;
    finalText.style.opacity = 1; // Final text appears
  }, 9500);
</script>

</body>
</html>
